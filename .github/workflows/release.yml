# Publishes every public package to npm, and the VS Code extension for stable
# releases. Run it from the Actions tab on the branch to release:
#
# - master: `version` patch, minor, major or X.Y.Z, `dist-tag` latest.
# - any branch, master included: `version` prerelease or X.Y.Z-alpha.N,
#   `dist-tag` alpha.
#
# lerna-lite bumps every package, regenerates the extension metadata, syncs
# pnpm-lock.yaml, then commits, tags `vX.Y.Z` and pushes to the selected
# branch; a failed push stops before anything is published. The recorded
# version is what the next `prerelease` bump starts from. `pnpm publish`
# authenticates with npm trusted publishing (OIDC) and adds provenance.
#
# Only `latest` releases go to the VS Code Marketplace and Open VSX, built from
# the pushed release tag: the marketplaces have no semver prerelease versions.
#
# The npm trusted publisher is bound to this filename, and a dispatch runs the
# workflow file of the selected branch, so every release branch carries this
# same file.
#
# If a publish fails after the version commit and tag were pushed, run it
# again on the same branch with `version` from-package: it skips lerna and
# publishes the version in lerna.json, provided the branch HEAD carries its
# `vX.Y.Z` tag. pnpm skips packages whose version is already on npm, and the
# marketplaces skip an extension version they already have.
#
# @volar/* come from the volar.js submodule as workspace packages. They are not
# published here: pnpm rewrites `workspace:*` to the submodule's exact versions,
# so the job stops unless those versions are already on npm.

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'patch, minor, major, prerelease, an exact version, or from-package'
        required: true
        default: patch
      dist-tag:
        description: 'npm dist-tag (latest only from master)'
        type: choice
        options: [latest, alpha]
        default: latest

permissions: {}

jobs:
  release:
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version commit and tag
      id-token: write # npm trusted publishing / provenance
    outputs:
      version: ${{ steps.publish.outputs.version }}
    steps:
      - name: Validate inputs
        env:
          VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ inputs.dist-tag }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/* ]]; then
            echo "::error::Run this workflow on a branch, not $GITHUB_REF"
            exit 1
          fi
          if [[ "$DIST_TAG" == latest ]]; then
            if [[ "$GITHUB_REF" != refs/heads/master ]]; then
              echo "::error::dist-tag latest is only published from master"
              exit 1
            fi
            pattern='^(patch|minor|major|[0-9]+\.[0-9]+\.[0-9]+|from-package)$'
          else
            pattern='^(prerelease|[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+|from-package)$'
          fi
          if [[ ! "$VERSION" =~ $pattern ]]; then
            echo "::error::version '$VERSION' does not fit dist-tag $DIST_TAG"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # lerna reads the previous release tag
          persist-credentials: false
          submodules: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - name: Check the volar.js packages are on npm
        run: |
          pnpm -r --filter './volar.js/**' exec node -e '
            const { name, version } = require("./package.json");
            const { execFileSync } = require("child_process");
            try {
              execFileSync("npm", ["view", `${name}@${version}`, "version"], { stdio: "pipe" });
            } catch {
              console.log(`::error::${name}@${version} from the volar.js submodule is not on npm; publish it from volar.js first`);
              process.exit(1);
            }
          '

      - run: pnpm run build

      - name: Publish
        id: publish
        env:
          VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ inputs.dist-tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$VERSION" == from-package ]]; then
            current="$(node -p "require('./lerna.json').version")"
            if ! git tag --points-at HEAD | grep -qxF "v$current"; then
              echo "::error::HEAD is not tagged v$current; from-package only publishes a pushed release commit"
              exit 1
            fi
            if [[ ("$DIST_TAG" == latest && "$current" == *-*) || ("$DIST_TAG" != latest && "$current" != *-alpha.*) ]]; then
              echo "::error::lerna.json version $current does not fit dist-tag $DIST_TAG"
              exit 1
            fi
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            pnpm exec lerna version "$VERSION" \
              --exact \
              --force-publish \
              --sync-workspace-lock \
              --yes
          fi
          pnpm -r --filter '!./volar.js/**' publish --tag "$DIST_TAG" --no-git-checks
          published="$(node -p "require('./lerna.json').version")"
          echo "version=$published" >> "$GITHUB_OUTPUT"
          echo "Published \`$published\` with dist-tag \`$DIST_TAG\`." >> "$GITHUB_STEP_SUMMARY"

  publish-vscode-marketplace:
    needs: release
    if: inputs.dist-tag == 'latest'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false
          submodules: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:volar

      - name: Publish to VSCode Marketplace
        working-directory: extensions/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm dlx @vscode/vsce publish --skip-duplicate

  publish-open-vsx:
    needs: release
    if: inputs.dist-tag == 'latest'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false
          submodules: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:volar

      - name: Publish to Open VSX
        working-directory: extensions/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: pnpm dlx ovsx publish --skip-duplicate
