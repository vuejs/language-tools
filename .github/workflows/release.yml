# Publishes every public package to npm, and the VS Code extension for stable
# releases. Run it from the Actions tab on the branch to release:
#
# - master: `version` patch, minor, major or X.Y.Z, `dist-tag` latest.
# - any branch, master included: `version` prerelease or X.Y.Z-alpha.N,
#   `dist-tag` alpha.
#
# lerna-lite bumps every package, regenerates the extension metadata, syncs
# pnpm-lock.yaml, then commits, tags `vX.Y.Z` and pushes to the selected
# branch; a failed push stops before anything is published. The recorded
# version is what the next `prerelease` bump starts from. `pnpm publish`
# authenticates with npm trusted publishing (OIDC) and adds provenance.
#
# Only `latest` releases go to the VS Code Marketplace and Open VSX, built from
# the pushed release tag: the marketplaces have no semver prerelease versions.
# After an `alpha` release, github-actions[bot] comments the version on the open
# pull request whose head is the released branch, if there is one.
# auto-alpha.yml on master dispatches `prerelease` / `alpha` releases of
# feature branches.
#
# The npm trusted publisher is bound to this filename, and a dispatch runs the
# workflow file of the selected branch, so every release branch carries this
# same file.
#
# If a publish fails after the version commit and tag were pushed, run it
# again on the same branch with `version` from-package: it skips lerna and
# publishes the version in lerna.json, provided the branch HEAD carries its
# `vX.Y.Z` tag. pnpm skips packages whose version is already on npm, and the
# marketplaces skip an extension version they already have.
#
# Only the lerna.json packages are published. Before anything is versioned, the
# job stops if a published package depends on another workspace package, such
# as one of a git submodule, that is not on npm at its exact version released
# from the checked out commit: pnpm rewrites `workspace:*` to that version.
# @volar/*, volar-service-* and muggle-string come from the volar.js, services and
# muggle-string submodules, so release them from their repositories first and
# point the submodules at those release commits.

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'patch, minor, major, prerelease, an exact version, or from-package'
        required: true
        default: patch
      dist-tag:
        description: 'npm dist-tag (latest only from master)'
        type: choice
        options: [latest, alpha]
        default: latest

permissions: {}

jobs:
  release:
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version commit and tag
      id-token: write # npm trusted publishing / provenance
    outputs:
      version: ${{ steps.publish.outputs.version }}
      previous: ${{ steps.publish.outputs.previous }}
      commits: ${{ steps.publish.outputs.commits }}
    steps:
      - name: Validate inputs
        env:
          VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ inputs.dist-tag }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/* ]]; then
            echo "::error::Run this workflow on a branch, not $GITHUB_REF"
            exit 1
          fi
          if [[ "$DIST_TAG" == latest ]]; then
            if [[ "$GITHUB_REF" != refs/heads/master ]]; then
              echo "::error::dist-tag latest is only published from master"
              exit 1
            fi
            pattern='^(patch|minor|major|[0-9]+\.[0-9]+\.[0-9]+|from-package)$'
          else
            pattern='^(prerelease|[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+|from-package)$'
          fi
          if [[ ! "$VERSION" =~ $pattern ]]; then
            echo "::error::version '$VERSION' does not fit dist-tag $DIST_TAG"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # lerna reads the previous release tag
          persist-credentials: false
          submodules: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - name: Check the workspace dependencies outside this release
        run: node .github/scripts/check-workspace-deps.mjs

      - run: pnpm run build

      - name: Publish
        id: publish
        env:
          VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ inputs.dist-tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$VERSION" == from-package ]]; then
            current="$(node -p "require('./lerna.json').version")"
            if ! git tag --points-at HEAD | grep -qxF "v$current"; then
              echo "::error::HEAD is not tagged v$current; from-package only publishes a pushed release commit"
              exit 1
            fi
            if [[ ("$DIST_TAG" == latest && "$current" == *-*) || ("$DIST_TAG" != latest && "$current" != *-alpha.*) ]]; then
              echo "::error::lerna.json version $current does not fit dist-tag $DIST_TAG"
              exit 1
            fi
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            pnpm exec lerna version "$VERSION" \
              --exact \
              --force-publish \
              --sync-workspace-lock \
              --yes
          fi
          pnpm -r --filter './packages/**' --filter './extensions/**' publish --tag "$DIST_TAG" --no-git-checks
          published="$(node -p "require('./lerna.json').version")"
          echo "version=$published" >> "$GITHUB_OUTPUT"
          if previous="$(git describe --tags --abbrev=0 --match 'v*' "v$published^" 2>/dev/null)"; then
            echo "previous=${previous#v}" >> "$GITHUB_OUTPUT"
            echo "commits=$(git rev-list --count "$previous..v$published^")" >> "$GITHUB_OUTPUT"
          fi
          echo "Published \`$published\` with dist-tag \`$DIST_TAG\`." >> "$GITHUB_STEP_SUMMARY"

  comment-alpha:
    needs: release
    if: inputs.dist-tag == 'alpha'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # comment on the pull request of the branch
    steps:
      - name: Comment on the open pull request of the branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.repository_owner }}:${{ github.ref_name }}
          VERSION: ${{ needs.release.outputs.version }}
          PREVIOUS: ${{ needs.release.outputs.previous }}
          COMMITS: ${{ needs.release.outputs.commits }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -z "$VERSION" ]]; then
            echo "::error::The release job gave no version"
            exit 1
          fi
          prs="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$HEAD" --jq '.[].number')"
          if [[ -z "$prs" ]]; then
            echo "No open pull request has the head $HEAD; nothing to comment on."
            exit 0
          fi
          if [[ -n "$PREVIOUS" ]]; then
            commits="$COMMITS commit"
            (( COMMITS == 1 )) || commits+=s
            links="[$commits]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/v$PREVIOUS...v$VERSION), [run]($RUN_URL)"
          else
            links="[run]($RUN_URL)"
          fi
          body="\`$VERSION\` is on npm with dist-tag \`alpha\` ($links)."
          for pr in $prs; do
            gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" -f body="$body" --jq '.html_url'
          done

  publish-vscode-marketplace:
    needs: release
    if: inputs.dist-tag == 'latest'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false
          submodules: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:volar

      - name: Publish to VSCode Marketplace
        working-directory: extensions/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm dlx @vscode/vsce publish --skip-duplicate

  publish-open-vsx:
    needs: release
    if: inputs.dist-tag == 'latest'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false
          submodules: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:volar

      - name: Publish to Open VSX
        working-directory: extensions/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: pnpm dlx ovsx publish --skip-duplicate
