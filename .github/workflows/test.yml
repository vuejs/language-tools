name: Test

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Clone and build the native TypeScript compiler (tsgo) used by the
      # content-mapper tests. This is temporary until content mappers ship in a
      # published TypeScript 7 build. Clone outside the workspace so vitest does
      # not pick up tsgo's own tests.
      - name: Clone tsgo
        run: git clone --depth 1 https://github.com/microsoft/typescript-go.git "${{ runner.temp }}/tsgo"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - run: npm install
        working-directory: ${{ runner.temp }}/tsgo

      - run: npm run build
        working-directory: ${{ runner.temp }}/tsgo

      - run: npm run test
        env:
          TSGO_PATH: ${{ runner.temp }}/tsgo/built/local/tsgo${{ runner.os == 'Windows' && '.exe' || '' }}
